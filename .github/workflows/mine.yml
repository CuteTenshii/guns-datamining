name: Get latest files

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours

jobs:
  fetch:
    name: Fetch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest files
        # Unset in forks and on any run without the secret: the scraper then skips the /account dashboard pages and
        # mines only what is public. A set-but-refused session fails the job instead of committing a partial snapshot.
        env:
          GUNS_SESSION: ${{ secrets.GUNS_SESSION }}
        run: bun run src/index.ts

      - name: Commit changes
        run: |
          git add .
          git commit -m "Update latest files" || echo "No changes to commit"
          git push origin master || echo "No changes to push"